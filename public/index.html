<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Store Sync</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <button type="button" class="skip-link" id="skip-link">Skip to content</button>
    <div class="app">
      <header class="topbar">
        <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true"></span>Store Sync</a>
        <button
          type="button"
          class="menu-button"
          id="menu-button"
          aria-expanded="false"
          aria-controls="sidebar"
        >
          <span class="nav-icon" data-icon="menu"></span>Menu
        </button>
      </header>
      <nav class="sidebar" id="sidebar" aria-label="Main">
        <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true"></span>Store Sync</a>
        <ul class="nav-list">
          <li>
            <a href="#/" data-nav="overview"
              ><span class="nav-icon" data-icon="home"></span>Overview</a
            >
          </li>
          <li>
            <a href="#/items" data-nav="items"
              ><span class="nav-icon" data-icon="box"></span>Products</a
            >
          </li>
          <li>
            <a href="#/mapping" data-nav="mapping"
              ><span class="nav-icon" data-icon="link"></span>Matching</a
            >
          </li>
          <li>
            <a href="#/stores" data-nav="stores"
              ><span class="nav-icon" data-icon="store"></span>Stores</a
            >
          </li>
          <li>
            <a href="#/activity" data-nav="activity"
              ><span class="nav-icon" data-icon="pulse"></span>Activity</a
            >
          </li>
          <li>
            <a href="#/alerts" data-nav="alerts"
              ><span class="nav-icon" data-icon="bell"></span>Alerts<span
                class="nav-count"
                id="alerts-count"
                hidden
              ></span
            ></a>
          </li>
          <li>
            <a href="#/settings" data-nav="settings"
              ><span class="nav-icon" data-icon="sliders"></span>Settings</a
            >
          </li>
          <!-- Last, so it can appear without moving the other links. -->
          <li id="nav-onboarding" hidden>
            <a href="#/onboarding" data-nav="onboarding"
              ><span class="nav-icon" data-icon="play"></span>Start syncing</a
            >
          </li>
        </ul>
      </nav>
      <div class="content">
        <div id="global-notice"></div>
        <main id="main" tabindex="-1"></main>
      </div>
    </div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <noscript><p class="noscript">This dashboard needs JavaScript turned on.</p></noscript>
  </body>
</html>
