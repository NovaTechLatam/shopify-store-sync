# Render Blueprint: one web service (built from the Dockerfile) and one Postgres database.
# Render > New > Blueprint > pick this repository. It asks for the values marked `sync: false`.
# Step-by-step guide: docs/operations.md
services:
  - type: web
    name: storesync
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Not the free plan: free services fall asleep, miss Shopify's 5-second webhook deadline and
    # stop the background sync.
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: storesync-db
          property: connectionString
      # Your service's address, e.g. https://storesync.onrender.com (shown at the top of the
      # service page once it exists; update it here if it differs).
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      # At least 12 characters.
      - key: ADMIN_PASSWORD
        sync: false
      # Random 32-byte key generated by Render. Copy it to your password manager: database
      # backups are useless without it.
      - key: ENCRYPTION_KEY
        generateValue: true

databases:
  - name: storesync-db
    databaseName: storesync
    user: storesync
    plan: basic-256mb
    postgresMajorVersion: '16'
    # No access from the internet; the web service connects over Render's private network.
    ipAllowList: []
